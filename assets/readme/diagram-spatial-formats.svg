<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <rect width="1200" height="480" fill="#fafafa"/>
  <line x1="600" y1="40" x2="600" y2="450" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 顶部两个身份标签 -->
  <text x="296" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">空间照片 · HEIC</text>
  <text x="900" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#c2410c">空间视频 · MV-HEVC</text>

  <!-- ============ 左：HEIC 文件 ============ -->
  <rect x="56" y="88" width="480" height="300" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="56" y="88" width="480" height="40" rx="16" fill="#2563eb"/>
  <rect x="56" y="112" width="480" height="16" fill="#2563eb"/>
  <text x="78" y="115" font-size="16" font-weight="bold" fill="#ffffff">📦 photo.heic</text>

  <!-- 左眼图（主体偏左） -->
  <rect x="84" y="150" width="190" height="140" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <polygon points="96,274 140,204 184,274" fill="#7dd3fc"/>
  <circle cx="128" cy="252" r="20" fill="#f97316"/>
  <text x="179" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">左眼图</text>

  <!-- 右眼图（主体偏右） -->
  <rect x="318" y="150" width="190" height="140" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <polygon points="330,274 374,204 418,274" fill="#7dd3fc"/>
  <circle cx="422" cy="252" r="20" fill="#f97316"/>
  <text x="413" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">右眼图</text>

  <text x="296" y="234" text-anchor="middle" font-size="22" fill="#94a3b8">+</text>

  <!-- 元数据卡（精简为词） -->
  <rect x="84" y="306" width="424" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="330" font-size="13" font-weight="bold" fill="#475569">🏷 元数据</text>
  <text x="100" y="354" font-size="12.5" fill="#64748b">基线 · 视场角 · 视差调整</text>

  <!-- ============ 右：MV-HEVC ============ -->
  <!-- 基础视图（左眼） -->
  <rect x="664" y="96" width="210" height="150" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <polygon points="676,206 720,142 764,206" fill="#fdba74"/>
  <circle cx="730" cy="182" r="18" fill="#ea580c"/>
  <text x="769" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">基础视图（左眼）</text>
  <text x="769" y="232" text-anchor="middle" font-size="11.5" fill="#9a3412">普通 2D HEVC</text>

  <!-- + Δ -->
  <text x="912" y="172" text-anchor="middle" font-size="30" font-weight="bold" fill="#ea580c">＋</text>
  <rect x="950" y="120" width="150" height="104" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1025" y="166" text-anchor="middle" font-size="24" font-weight="bold" fill="#ea580c">Δ</text>
  <text x="1025" y="194" text-anchor="middle" font-size="12.5" fill="#c2410c">左右眼差值</text>

  <!-- 解码分支 -->
  <line x1="769" y1="246" x2="769" y2="300" stroke="#94a3b8" stroke-width="2"/>
  <line x1="1025" y1="224" x2="1025" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 1025 300 Q 1025 330 950 348" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>

  <rect x="664" y="302" width="210" height="86" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="769" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#475569">📱 2D 播放器</text>
  <text x="769" y="358" text-anchor="middle" font-size="12.5" fill="#64748b">只读基础视图</text>

  <rect x="890" y="302" width="210" height="86" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="995" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#c2410c">🥽 3D 设备</text>
  <text x="995" y="358" text-anchor="middle" font-size="12.5" fill="#9a3412">基础 + 差值 → 双眼</text>
</svg>
