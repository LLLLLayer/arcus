<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="PingFang SC, Hiragino Sans GB, Helvetica, sans-serif">
  <rect width="1200" height="500" fill="#fafafa"/>
  <line x1="600" y1="40" x2="600" y2="470" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 顶部两个身份标签 -->
  <text x="300" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#1d4ed8">手机 · 运动视差</text>
  <text x="900" y="52" text-anchor="middle" font-size="22" font-weight="bold" fill="#6d28d9">头显 · 双目视差</text>

  <!-- ===== 左：手机三连（晃动） ===== -->
  <g transform="rotate(-16 175 280)" opacity="0.4">
    <rect x="140" y="198" width="100" height="180" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="150" y="212" width="80" height="152" rx="4" fill="#e0f2fe"/>
    <polygon points="158,350 188,302 218,350" fill="#7dd3fc"/>
    <circle cx="172" cy="324" r="13" fill="#fb923c"/>
  </g>
  <text x="150" y="190" font-size="13" fill="#60a5fa">t₁</text>

  <g transform="rotate(16 445 280)" opacity="0.4">
    <rect x="410" y="198" width="100" height="180" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="420" y="212" width="80" height="152" rx="4" fill="#e0f2fe"/>
    <polygon points="428,350 458,302 488,350" fill="#7dd3fc"/>
    <circle cx="478" cy="324" r="13" fill="#fb923c"/>
  </g>
  <text x="488" y="190" font-size="13" fill="#60a5fa">t₃</text>

  <rect x="256" y="190" width="108" height="196" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="268" y="206" width="84" height="164" rx="5" fill="#dbeafe"/>
  <polygon points="276,356 310,302 344,356" fill="#38bdf8"/>
  <circle cx="310" cy="328" r="15" fill="#f97316"/>
  <text x="310" y="182" text-anchor="middle" font-size="13" fill="#1e293b">t₂</text>

  <!-- 晃动双向弧箭头 -->
  <path d="M 150 416 Q 310 450 470 416" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="150,416 166,407 166,425" fill="#2563eb"/>
  <polygon points="470,416 454,407 454,425" fill="#2563eb"/>

  <!-- 一只眼 -->
  <ellipse cx="310" cy="448" rx="22" ry="13" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="310" cy="448" r="6" fill="#334155"/>

  <!-- ===== 右：头显双目 ===== -->
  <rect x="720" y="190" width="360" height="118" rx="26" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="745" y="214" width="140" height="72" rx="10" fill="#1e1b4b"/>
  <rect x="915" y="214" width="140" height="72" rx="10" fill="#1e1b4b"/>
  <polygon points="755,276 783,246 811,276" fill="#7dd3fc"/>
  <circle cx="792" cy="264" r="11" fill="#fb923c"/>
  <polygon points="925,276 953,246 981,276" fill="#7dd3fc"/>
  <circle cx="996" cy="264" r="11" fill="#fb923c"/>
  <text x="815" y="206" text-anchor="middle" font-size="12" fill="#6d28d9">左视图</text>
  <text x="985" y="206" text-anchor="middle" font-size="12" fill="#6d28d9">右视图</text>

  <!-- 两只眼 -->
  <ellipse cx="815" cy="372" rx="22" ry="13" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="815" cy="372" r="6" fill="#334155"/>
  <text x="815" y="404" text-anchor="middle" font-size="12" fill="#475569">左眼</text>
  <ellipse cx="985" cy="372" rx="22" ry="13" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="985" cy="372" r="6" fill="#334155"/>
  <text x="985" y="404" text-anchor="middle" font-size="12" fill="#475569">右眼</text>
  <line x1="815" y1="290" x2="815" y2="358" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="985" y1="290" x2="985" y2="358" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- 大脑融合 -->
  <line x1="815" y1="386" x2="888" y2="438" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="985" y1="386" x2="912" y2="438" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="900" cy="452" rx="46" ry="24" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="900" y="458" text-anchor="middle" font-size="14" font-weight="bold" fill="#be185d">大脑融合</text>
</svg>
