<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="360" rx="28" fill="#0f172a"/>
  <text x="600" y="48" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#f8fafc">照片级 2D→3D 的四步流水线</text>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" filter="url(#shadow)">
    <rect x="56" y="105" width="224" height="170" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="168" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#e0f2fe">1. 估远近</text>
    <text x="168" y="184" text-anchor="middle" font-size="17" fill="#cbd5e1">给每个像素一张</text>
    <text x="168" y="212" text-anchor="middle" font-size="17" fill="#cbd5e1">相对深度图</text>
    <text x="168" y="245" text-anchor="middle" font-size="15" fill="#7dd3fc">谁近谁动得多</text>

    <rect x="344" y="105" width="224" height="170" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="456" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#ede9fe">2. 分层</text>
    <text x="456" y="184" text-anchor="middle" font-size="17" fill="#cbd5e1">把主体和背景</text>
    <text x="456" y="212" text-anchor="middle" font-size="17" fill="#cbd5e1">拆成可动素材</text>
    <text x="456" y="245" text-anchor="middle" font-size="15" fill="#c4b5fd">从哪里切开</text>

    <rect x="632" y="105" width="224" height="170" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="744" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#ffedd5">3. 补空洞</text>
    <text x="744" y="184" text-anchor="middle" font-size="17" fill="#cbd5e1">主体移开后</text>
    <text x="744" y="212" text-anchor="middle" font-size="17" fill="#cbd5e1">背后要有内容</text>
    <text x="744" y="245" text-anchor="middle" font-size="15" fill="#fed7aa">观感上限</text>

    <rect x="920" y="105" width="224" height="170" rx="18" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="1032" y="146" text-anchor="middle" font-size="22" font-weight="700" fill="#dcfce7">4. 实时画</text>
    <text x="1032" y="184" text-anchor="middle" font-size="17" fill="#cbd5e1">模型只跑一次</text>
    <text x="1032" y="212" text-anchor="middle" font-size="17" fill="#cbd5e1">GPU 每帧重画</text>
    <text x="1032" y="245" text-anchor="middle" font-size="15" fill="#86efac">交互流畅</text>
  </g>

  <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M288 190H332"/>
    <path d="M576 190H620"/>
    <path d="M864 190H908"/>
  </g>

  <text x="600" y="318" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#cbd5e1">一句话：深度决定怎么动，补洞决定像不像，预计算决定能不能实时交互</text>
</svg>
